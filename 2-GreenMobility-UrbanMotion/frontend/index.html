<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenMobility – Hotspotparkering</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-api-port="5102">
  <header class="appbar">
    <div class="brand">
      <span class="logo">GM</span>
      <div><strong>GreenMobility</strong><small>Hotspot-parkering</small></div>
    </div>
    <div class="appbar-actions">
      <button class="help-btn" id="help-open">Hjælp</button>
      <button class="icon-btn" id="menu-open" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </header>

  <nav class="menu" id="menu" hidden>
    <div class="who" id="menu-who"></div>
    <button data-open="history">Mine reservationer</button>
    <button data-open="rules">Regler og vilkår</button>
    <button data-open="privacy">Privatliv</button>
  </nav>

  <main class="app">
    <section id="my-reservation"></section>

    <div class="search">
      <input type="search" id="search" placeholder="Søg hotspot eller adresse" aria-label="Søg efter hotspot">
      <button class="secondary" id="near-me" title="Sortér efter afstand til dig">Nær mig</button>
    </div>
    <p class="list-meta" id="list-meta"></p>
    <ul class="hotspots" id="hotspot-list"></ul>
  </main>

  <dialog class="sheet" id="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" aria-label="Luk">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
